experiment:
  name: CausaFlux v0.4.0 multimodal causal integration demonstration
  seed: 31
output: causaflux_v0.4.0_output
data:
  mode: synthetic
  n_donors: 8
  clones_per_donor: 30
  non_tumor_cells_per_type: 8
  times:
  - 0
  - 24
  - 72
  - 168
state_model:
  representation: multimodal_early_fusion
  modalities:
  - rna
  - atac
  - protein
  - mutation
  - drug_response
